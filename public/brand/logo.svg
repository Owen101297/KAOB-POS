    <!-- Letra K geométrica -->
    <path d="M 120 70 L 145 70 L 145 200 L 120 200 Z" />
    <path d="M 145 135 L 210 70 L 245 70 L 175 140 L 250 200 L 215 200 L 150 148 Z" />
    
    <!-- Letra Lambda / A estilizada (sin travesaño) -->
