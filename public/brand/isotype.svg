<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #000000; }
      .circle-ring { fill: none; stroke: #FFFFFF; stroke-width: 14; }
      .monogram { fill: #FFFFFF; font-family: 'Playfair Display', 'Bodoni MT', 'Didot', 'Georgia', serif; font-weight: 700; }
    </style>
  </defs>
  <!-- Fondo circular oscuro -->
  <circle cx="250" cy="250" r="250" class="bg" />
  
  <!-- Anillo exterior blanco -->
  <circle cx="250" cy="250" r="200" class="circle-ring" />
  
  <!-- Monograma KA estilizado entrelazado -->
  <g transform="translate(250, 250)">
    <!-- Barra vertical K con serifa -->
    <path d="M -75 -105 L -45 -105 L -45 105 L -75 105 L -75 92 L -58 92 L -58 -92 L -75 -92 Z" fill="#FFFFFF" />
    
    <!-- Diagonal superior K con serifa -->
    <path d="M -50 -10 L 25 -105 L 55 -105 L 55 -92 L 40 -92 L -20 0 Z" fill="#FFFFFF" />
    
    <!-- Pata derecha A estilizada (diagonal que cruza) -->
    <path d="M -15 -10 L 45 105 L 75 105 L 75 92 L 60 92 L 10 -25 Z" fill="#FFFFFF" />
    
    <!-- Pata izquierda A estilizada (línea fina) -->
    <path d="M -20 -10 L -60 105 L -35 105 L -10 10 Z" fill="#FFFFFF" />
  </g>
</svg>
